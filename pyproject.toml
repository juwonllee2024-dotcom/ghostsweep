[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostsweep"
version = "0.1.0"
description = "Find and reversibly quarantine empty AI coding sessions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "juwonllee2024-dotcom" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
ghostsweep = "ghostsweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
