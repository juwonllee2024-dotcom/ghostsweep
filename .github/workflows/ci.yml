name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff mypy build pip-audit
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Build
        run: python -m build
      - name: Audit built artifacts
        run: pip-audit --path dist
      - name: Check patch whitespace
        run: git diff --check
